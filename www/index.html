<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Gem</title>
    <!-- Wapas html2pdf engine par aaye hain jo complex CSS ko perfect render karta hai -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="cordova.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Premium Top Bar */
        .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: #1e293b; border-bottom: 1px solid #334155; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 8px; padding: 8px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        /* Workspace & Paper */
        .workspace { flex: 1; overflow-y: auto; padding: 20px; background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px); background-size: 20px 20px; display: flex; justify-content: center; }
        .paper { width: 100%; max-width: 800px; background: white; color: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.05); outline: none; font-size: 14px; line-height: 1.6; min-height: 100%; transition: 0.3s; }
        .paper:focus { box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 2px #3b82f6; }
        
        /* Floating Bottom Bar */
        .bottom-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid #334155; padding: 10px; border-radius: 50px; display: flex; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 100; width: calc(100% - 40px); max-width: 500px; }
        .btn { flex: 1; padding: 14px; border-radius: 40px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #d946ef); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
        .btn-pdf { background: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        
        /* Settings Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: calc(100% - 40px); max-width: 400px; transform: translateY(20px); transition: 0.3s; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal.active .modal-content { transform: translateY(0); }
        .modal h2 { font-size: 20px; margin-bottom: 20px; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
        .modal h2 span { cursor: pointer; color: #94a3b8; font-size: 24px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .input-group input, .input-group select { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 14px; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        /* Toast Notification */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 30px; border: 1px solid #334155; font-size: 14px; z-index: 2000; opacity: 0; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: none; text-align: center; font-weight: 500; }
        .toast.show { opacity: 1; top: 30px; }
        
        /* Loader */
        .loader { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Modern Header -->
    <div class="header">
        <h1>PDF Gem</h1>
        <button class="icon-btn" onclick="toggleModal()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>

    <!-- Editor Area -->
    <div class="workspace">
        <div id="editor" class="paper" contenteditable="true" placeholder="Start typing or paste your HTML/text here..."></div>
    </div>

    <!-- Floating Bottom Bar -->
    <div class="bottom-bar">
        <button class="btn btn-ai" onclick="generateAI()" id="btn-ai">
            <span id="ai-text">✨ AI Generate</span>
            <div class="loader" id="ai-loader"></div>
        </button>
        <button class="btn btn-pdf" onclick="downloadPDF()" id="btn-pdf">
            <span id="pdf-text">📄 Save PDF</span>
            <div class="loader" id="pdf-loader"></div>
        </button>
    </div>

    <!-- Modern Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>API Settings <span onclick="toggleModal()">×</span></h2>
            <div class="input-group">
                <label>Bridge URL</label>
                <input type="text" id="apiUrlInput" value="http://127.0.0.1:8787/v1">
            </div>
            <div class="input-group">
                <label>Model Name</label>
                <input type="text" id="modelInput" value="samu">
            </div>
            <div class="input-group">
                <label>Bearer Token</label>
                <input type="password" id="apiKeyInput" value="samu123456">
            </div>
            <div class="input-group">
                <label>AI Layout Style</label>
                <select id="aiStyle">
                    <option value="Default">Auto / Professional</option>
                    <option value="Educational">Educational</option>
                    <option value="Math">Math</option>
                </select>
            </div>
            <button class="btn btn-pdf" style="margin-top: 10px; padding: 12px;" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>

    <div id="toast" class="toast">Settings Saved!</div>

    <script>
        // --- UI & State Management ---
        const editor = document.getElementById('editor');
        const toast = document.getElementById('toast');
        
        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('active');
        }

        function saveSettings() {
            localStorage.setItem('api_url', document.getElementById('apiUrlInput').value);
            localStorage.setItem('api_model', document.getElementById('modelInput').value);
            localStorage.setItem('api_key', document.getElementById('apiKeyInput').value);
            localStorage.setItem('ai_style', document.getElementById('aiStyle').value);
            toggleModal();
            showToast("Settings saved successfully");
        }

        // Load settings on startup
        document.getElementById('apiUrlInput').value = localStorage.getItem('api_url') || 'http://127.0.0.1:8787/v1';
        document.getElementById('modelInput').value = localStorage.getItem('api_model') || 'samu';
        document.getElementById('apiKeyInput').value = localStorage.getItem('api_key') || 'samu123456';
        document.getElementById('aiStyle').value = localStorage.getItem('ai_style') || 'Default';

        // --- API Request (Native HTTP to bypass WebView CORS) ---
        async function fetchAPI(endpoint, data = null) {
            const baseUrl = (localStorage.getItem('api_url') || 'http://127.0.0.1:8787/v1').replace(/\/+$/, '');
            const url = baseUrl + endpoint;
            const key = localStorage.getItem('api_key') || 'samu123456';
            const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key };

            if (window.cordova && cordova.plugin && cordova.plugin.http) {
                return new Promise((resolve, reject) => {
                    cordova.plugin.http.setDataSerializer('json');
                    if (data) {
                        cordova.plugin.http.post(url, data, headers, (res) => {
                            try { resolve(JSON.parse(res.data)); } catch(e) { resolve(res.data); }
                        }, (err) => reject(new Error("HTTP " + err.status)));
                    } else {
                        cordova.plugin.http.get(url, {}, headers, (res) => {
                            try { resolve(JSON.parse(res.data)); } catch(e) { resolve(res.data); }
                        }, (err) => reject(new Error("HTTP " + err.status)));
                    }
                });
            } else {
                const opts = { method: data ? 'POST' : 'GET', headers };
                if(data) opts.body = JSON.stringify(data);
                const res = await fetch(url, opts);
                if(!res.ok) throw new Error("HTTP " + res.status);
                return await res.json();
            }
        }

        // --- AI Generation ---
        async function generateAI() {
            const text = editor.innerText.trim();
            if(!text) return showToast("Please type something first");
            
            const btn = document.getElementById('btn-ai');
            const textEl = document.getElementById('ai-text');
            const loader = document.getElementById('ai-loader');
            
            btn.disabled = true;
            textEl.style.display = 'none';
            loader.style.display = 'block';
            
            const model = localStorage.getItem('api_model') || 'samu';
            const style = localStorage.getItem('ai_style') || 'Default';
            
            const prompt = `Format the following content as professional HTML for a PDF document.
STYLE: ${style}
RULES:
- Output ONLY raw HTML. No markdown, no explanations.
- Use INLINE styles only. Colors, flexbox, tables are allowed.
- Ensure clean page breaks by wrapping sections in divs with 'page-break-after: always;' if needed.
- Preserve all original text exactly.

CONTENT:
${text}`;
            
            try {
                const data = await fetchAPI('/chat/completions', { 
                    model: model, 
                    messages: [{role: 'user', content: prompt}],
                    stream: false
                });
                
                let html = data.choices[0].message.content;
                html = html.replace(/```html/gi, '').replace(/```/g, '').trim();
                
                editor.innerHTML = html;
                showToast("✨ AI Generated successfully!");
                
            } catch(e) {
                console.error(e);
                showToast("❌ AI Failed: " + e.message);
            } finally {
                btn.disabled = false;
                textEl.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        // --- Download PDF (html2pdf Engine) ---
        async function downloadPDF() {
            if(!editor.innerText.trim()) return showToast("Nothing to save");
            
            const btn = document.getElementById('btn-pdf');
            const textEl = document.getElementById('pdf-text');
            const loader = document.getElementById('pdf-loader');
            
            btn.disabled = true;
            textEl.style.display = 'none';
            loader.style.display = 'block';
            showToast("Generating PDF... Please wait.");
            
            // html2pdf configuration for high quality and perfect CSS rendering
            const opt = {
                margin:       0,
                filename:     'PDF_Gem_' + Date.now() + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'], avoid: ['div', 'p', 'h1', 'h2', 'h3', 'table'] }
            };

            try {
                const worker = html2pdf().set(opt).from(editor);
                
                if (window.cordova && cordova.file) {
                    // Native Android Save
                    const dataUri = await worker.output('datauristring');
                    const base64 = dataUri.split(',')[1];
                    const bin = atob(base64);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    const blob = new Blob([bytes], { type: 'application/pdf' });
                    
                    const fileName = opt.filename;
                    const downloadDir = cordova.file.externalRootDirectory + 'Download/';
                    
                    window.resolveLocalFileSystemURL(downloadDir, (dirEntry) => {
                        dirEntry.getFile(fileName, { create: true, exclusive: false }, (fileEntry) => {
                            fileEntry.createWriter((fileWriter) => {
                                fileWriter.onwriteend = () => {
                                    showToast("✅ Saved to Downloads!");
                                    if (cordova.plugins && cordova.plugins.fileOpener2) {
                                        cordova.plugins.fileOpener2.open(fileEntry.nativeURL, 'application/pdf', {
                                            error: function() { showToast("Saved. Open via WPS Office."); }
                                        });
                                    }
                                };
                                fileWriter.write(blob);
                            });
                        });
                    }, () => showToast("❌ Storage access denied"));
                } else {
                    // Browser Save
                    await worker.save();
                    showToast("✅ Downloaded!");
                }
            } catch(e) {
                console.error(e);
                showToast("❌ PDF generation failed.");
            } finally {
                btn.disabled = false;
                textEl.style.display = 'block';
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
